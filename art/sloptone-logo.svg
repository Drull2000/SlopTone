<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- the banner's icon as a square logo: same background, accent bar and isometric block -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171230"/>
      <stop offset="0.6" stop-color="#0e1119"/>
      <stop offset="1" stop-color="#0a1a22"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="16" y="16" width="480" height="480" rx="96"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect x="16" y="16" width="480" height="480" fill="url(#bg)"/>
    <rect x="16" y="16" width="480" height="10" fill="url(#acc)"/>
  </g>

  <g transform="translate(80 64) scale(1.354)">
    <polygon points="130,0 260,75 130,150 0,75" fill="#2b2547"/>
    <polygon points="0,75 130,150 130,290 0,215" fill="#1a1630"/>
    <polygon points="260,75 130,150 130,290 260,215" fill="#221d3c"/>
    <g fill="#22d3ee">
      <rect x="40" y="150" width="18" height="18"/>
      <rect x="72" y="196" width="14" height="14"/>
      <rect x="190" y="160" width="16" height="16"/>
      <rect x="168" y="210" width="12" height="12"/>
    </g>
    <polyline points="40,75 100,110 160,75 220,110" fill="none" stroke="url(#acc)" stroke-width="14"
              stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="220" cy="110" r="12" fill="#ffffff" filter="url(#glow)"/>
  </g>
</svg>
