<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171230"/>
      <stop offset="0.6" stop-color="#0e1119"/>
      <stop offset="1" stop-color="#0a1a22"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <clipPath id="card"><rect width="1280" height="400" rx="40"/></clipPath>
  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect x="0" y="0" width="1280" height="8" fill="url(#acc)"/>
  </g>

  <!-- icon: isometric block with a glowing route across it -->
  <g transform="translate(110 70)">
    <polygon points="130,0 260,75 130,150 0,75" fill="#2b2547"/>
    <polygon points="0,75 130,150 130,290 0,215" fill="#1a1630"/>
    <polygon points="260,75 130,150 130,290 260,215" fill="#221d3c"/>
    <!-- ore specks -->
    <g fill="#22d3ee">
      <rect x="40" y="150" width="18" height="18"/>
      <rect x="72" y="196" width="14" height="14"/>
      <rect x="190" y="160" width="16" height="16"/>
      <rect x="168" y="210" width="12" height="12"/>
    </g>
    <!-- route over the top face -->
    <polyline points="40,75 100,110 160,75 220,110" fill="none" stroke="url(#acc)" stroke-width="14"
              stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="220" cy="110" r="12" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <text x="430" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="132" font-weight="800" letter-spacing="-3">
    <tspan fill="#a78bfa">Slop</tspan><tspan fill="#f1f3f9">Tone</tspan>
  </text>
  <text x="436" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#8c92a5" letter-spacing="2">
    pathfinding bot · Minecraft 26.3 · Forge
  </text>
  <text x="436" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#555b6c">by manstruk</text>
</svg>
